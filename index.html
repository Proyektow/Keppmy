<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#030407">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Desk Orbit • Clock & Now Playing</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Fondo ambiental reactivo -->
  <div class="ambient-glow" id="ambient-glow"></div>

  <!-- Botón flotante para forzar pantalla completa inmersiva -->
  <button class="fullscreen-trigger" id="fs-btn" onclick="toggleFullscreen()" title="Pantalla completa">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
    </svg>
  </button>

  <!-- Contenedor 3D tipo Libro / Cilindro -->
  <div class="stage-viewport">
    <div class="carousel-cylinder" id="cylinder">

      <!-- PÁGINA 1: RELOJ ULTRA-CLEAN -->
      <section class="cylinder-page page-clock active">
        <div class="clock-display">
          <div class="time-main">
            <span id="hours-mins">--:--</span>
            <span class="seconds-sub" id="seconds">--</span>
          </div>
          <div class="date-full" id="date-label">Cargando fecha...</div>
        </div>
      </section>

      <!-- PÁGINA 2: NOW PLAYING SPOTIFY -->
      <section class="cylinder-page page-music">
        <!-- Sub-vista A: Autorización -->
        <div class="music-auth-card" id="music-auth">
          <div class="auth-icon">🎵</div>
          <h3>Spotify Now Playing</h3>
          <p>Conéctate para ver lo que suena en tu PC o móvil.</p>
          <input type="text" id="client-id-input" placeholder="Client ID de Spotify" class="dark-input">
          <button class="btn-spotify" onclick="loginSpotify()">Conectar</button>
        </div>

        <!-- Sub-vista B: Reproductor Vivo -->
        <div class="music-player-grid" id="music-player" style="display: none;">
          <div class="art-frame">
            <img id="track-art" src="" alt="Album Art">
            <div class="eq-badge" id="eq-indicator">
              <span></span><span></span><span></span>
            </div>
          </div>

          <div class="track-details">
            <div class="track-text">
              <h2 id="track-name">Sin reproducción activa</h2>
              <h3 id="track-artist">Abre Spotify</h3>
              <p id="track-album">--</p>
            </div>

            <!-- Progreso -->
            <div class="progress-wrap">
              <span id="time-cur">0:00</span>
              <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
              </div>
              <span id="time-tot">0:00</span>
            </div>

            <!-- Botones táctiles -->
            <div class="track-actions">
              <button class="ctrl-btn" onclick="controlPlayback('previous')">⏮️</button>
              <button class="ctrl-btn btn-play" id="btn-play-pause" onclick="togglePlayPause()">▶️</button>
              <button class="ctrl-btn" onclick="controlPlayback('next')">⏭️</button>
            </div>

            <div class="device-tag" id="device-label">🔊 Buscando dispositivo...</div>
          </div>
        </div>
      </section>

    </div>
  </div>

  <!-- Controles de navegación de libro (flechas e indicadores de página) -->
  <nav class="book-nav">
    <button class="nav-arrow" onclick="rotateBook(-1)">‹</button>
    <div class="page-dots">
      <span class="dot active" onclick="goToPage(0)"></span>
      <span class="dot" onclick="goToPage(1)"></span>
    </div>
    <button class="nav-arrow" onclick="rotateBook(1)">›</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
