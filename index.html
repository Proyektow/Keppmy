<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06080d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Garraioa">
  <title>Gaua & Eguna • Reloj & Asistente</title>

  <!-- PWA Manifest incrustado directamente para habilitar instalación en Android -->
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22Garraioa%20Gaua%20eta%20Eguna%22%2C%22short_name%22%3A%22Garraioa%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2306080d%22%2C%22theme_color%22%3A%22%2306080d%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%3E%3Ctext%20y%3D'.9em'%20font-size%3D'90'%3E%F0%9F%97%BA%EF%B8%8F%3C%2Ftext%3E%3C%2Fsvg%3E%22%2C%22sizes%22%3A%22192x192%20512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">

  <style>
    :root {
      --bg: #06080d;
      --card-bg: rgba(18, 22, 33, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-muted: #798599;
      --accent: #38bdf8;
      --yellow: #fbbf24;
      --red-mic: #ef4444;
      --google-blue: #4285f4;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    /* Corrección de altura para Chrome Android: 100dvh + safe area */
    html, body {
      height: 100%;
      background-color: var(--bg);
    }

    body {
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* 1. SECCIÓN SUPERIOR: TIEMPO */
    .weather-hero {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(14px);
      border-radius: 16px;
      padding: 10px 16px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .weather-left { display: flex; align-items: center; gap: 10px; }
    .weather-icon-big { font-size: 2.2rem; }
    .weather-temp-giant {
      font-size: 2.4rem;
      font-weight: 900;
      line-height: 1;
      color: #fff;
    }

    .weather-right { text-align: right; }
    .weather-city {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .weather-desc-lead {
      font-size: 0.8rem;
      color: var(--text);
      font-weight: 600;
      margin-top: 1px;
    }

    .weather-submetrics {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* 2. RELOJ CENTRAL */
    .clock-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      border-radius: 20px;
      padding: 8px 16px;
      margin: 10px 0;
      flex-shrink: 0;
      transition: transform 0.15s ease;
    }

    .clock-container:active { transform: scale(0.98); }

    .time-digits {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", monospace;
      font-size: clamp(4.2rem, 16vw, 5.8rem);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -2px;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.08);
      transition: all 0.3s ease;
    }

    .seconds-mark {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--accent);
      margin-left: 2px;
    }

    .date-label {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 6px;
      text-transform: capitalize;
    }

    .clock-hint {
      font-size: 0.65rem;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--accent);
      margin-top: 4px;
      opacity: 0.75;
    }

    .clock-container.listening .time-digits {
      color: var(--red-mic);
      text-shadow: 0 0 30px rgba(239, 68, 68, 0.7);
      animation: pulse-clock 1.2s infinite;
    }

    .clock-container.listening .clock-hint {
      color: var(--red-mic);
      opacity: 1;
      font-weight: 700;
    }

    @keyframes pulse-clock {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* 3. RESPUESTA ASISTENTE */
    .assistant-bubble {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }

    .assistant-icon-mini {
      font-size: 1.3rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .assistant-bubble-text {
      flex: 1;
      font-size: 0.82rem;
      font-weight: 500;
      line-height: 1.3;
      color: var(--text);
    }

    /* 4. BARRA INFERIOR (Con botón de instalación integrado) */
    .bottom-toolbar {
      width: 100%;
      max-width: 440px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      flex-shrink: 0;
    }

    .btn-compact {
      background: #11141e;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 4px;
      border-radius: 10px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.15s;
    }

    .btn-compact:active {
      background: #1c2233;
      color: #fff;
      border-color: var(--accent);
    }

    .btn-install-pwa {
      border-color: rgba(56, 189, 248, 0.4);
      color: var(--accent);
    }

    /* 5. MODAL CALENDARIO */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: #0f131d;
      border: 1px solid var(--card-border);
      border-radius: 18px;
      width: 100%;
      max-width: 420px;
      max-height: 85dvh;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 10px;
    }

    .modal-title { font-size: 1rem; font-weight: 800; color: #fff; }
    .btn-close {
      background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer;
    }

    .sync-config-box {
      background: #161c28;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sync-config-box label { font-size: 0.7rem; color: var(--accent); font-weight: 700; }

    .events-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
    }

    .event-item {
      background: #161c28;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 9px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .event-info h4 { font-size: 0.85rem; font-weight: 700; color: #fff; }
    .event-info p { font-size: 0.7rem; color: var(--accent); margin-top: 2px; }

    .event-actions { display: flex; align-items: center; gap: 6px; }

    .btn-gcal {
      background: rgba(66, 133, 244, 0.15);
      border: 1px solid var(--google-blue);
      color: #93c5fd;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 4px 6px;
      text-decoration: none;
    }

    .btn-del-event {
      background: none; border: none; color: #ef4444; font-size: 1.1rem; cursor: pointer; padding: 2px;
    }

    .quick-add-form {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid var(--card-border);
      padding-top: 10px;
    }

    .input-event {
      background: #1a2232;
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      outline: none;
    }

    .btn-save-event {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 9px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 1. El Tiempo -->
  <header class="weather-hero" onclick="askWeather('hoy')">
    <div class="weather-left">
      <div class="weather-icon-big" id="w-icon">⛅</div>
      <div class="weather-temp-giant" id="w-temp">--°</div>
    </div>
    <div class="weather-right">
      <div class="weather-city">Bilbao</div>
      <div class="weather-desc-lead" id="w-summary">Cargando...</div>
      <div class="weather-submetrics" id="w-sub">Mín: --° • Máx: --° • 💧 --%</div>
    </div>
  </header>

  <!-- 2. Reloj Central (Tocar para hablar) -->
  <main class="clock-container" id="clock-trigger" onclick="toggleVoice()">
    <div class="time-digits">
      <span id="hours-mins">--:--</span><span class="seconds-mark" id="seconds">--</span>
    </div>
    <div class="date-label" id="date-label">Cargando fecha...</div>
    <div class="clock-hint" id="clock-hint">Toca la hora para hablar</div>
  </main>

  <!-- 3. Respuesta Asistente -->
  <div class="assistant-bubble" id="assistant-bubble">
    <div class="assistant-icon-mini" id="bubble-icon">🤖</div>
    <div class="assistant-bubble-text" id="bubble-text">Toca la hora para pedir el tiempo o añadir una cita.</div>
  </div>

  <!-- 4. Barra Inferior Visible -->
  <footer class="bottom-toolbar">
    <button class="btn-compact" onclick="askWeather('hoy')">
      <span>☀️</span> Hoy
    </button>
    <button class="btn-compact" onclick="askWeather('mañana')">
      <span>🌧️</span> Mañana
    </button>
    <button class="btn-compact" onclick="openCalendarModal()">
      <span>📅</span> Agenda
    </button>
    <button class="btn-compact btn-install-pwa" id="btn-install" onclick="triggerPwaInstall()">
      <span>📲</span> Instalar
    </button>
  </footer>

  <!-- 5. Modal Calendario -->
  <div class="modal-backdrop" id="calendar-modal">
    <div class="modal-box">
      <div class="modal-head">
        <h3 class="modal-title">Agenda & Google Calendar</h3>
        <button class="btn-close" onclick="closeCalendarModal()">&times;</button>
      </div>

      <div class="sync-config-box">
        <label>URL Secreta iCal de Google Calendar (.ics):</label>
        <div style="display: flex; gap: 4px;">
          <input type="text" id="ical-url-input" placeholder="https://calendar.google.com/.../basic.ics" class="input-event" style="flex: 1; font-size: 0.7rem;">
          <button class="btn-save-event" style="padding: 4px 8px; font-size: 0.7rem;" onclick="saveAndSyncIcal()">Cargar</button>
        </div>
      </div>

      <div class="events-list" id="events-container"></div>

      <div class="quick-add-form">
        <input type="text" id="new-event-title" placeholder="Nuevo evento (ej. Clase, Gym)..." class="input-event">
        <div style="display: flex; gap: 6px;">
          <input type="date" id="new-event-date" class="input-event" style="flex: 1;">
          <input type="time" id="new-event-time" class="input-event" style="width: 100px;">
        </div>
        <button class="btn-save-event" onclick="addEventManual()">Guardar en Agenda</button>
      </div>
    </div>
  </div>

  <script>
    // 1. Registro de Service Worker para habilitar instalación PWA
    let deferredPrompt = null;
    const installBtn = document.getElementById('btn-install');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'flex';
    });

    function triggerPwaInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            installBtn.style.display = 'none';
          }
          deferredPrompt = null;
        });
      } else {
        alert("Para instalar: pulsa los 3 puntos de Chrome arriba a la derecha y selecciona 'Añadir a pantalla de inicio' o 'Instalar aplicación'.");
      }
    }

    if ('serviceWorker' in navigator) {
      const swCode = `
        self.addEventListener('install', (e) => self.skipWaiting());
        self.addEventListener('activate', (e) => self.clients.claim());
        self.addEventListener('fetch', (e) => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
      `;
      const blob = new Blob([swCode], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    // 2. Reloj en tiempo real
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('hours-mins').textContent = `${h}:${m}`;
      document.getElementById('seconds').textContent = s;

      const opts = { weekday: 'long', day: 'numeric', month: 'long' };
      document.getElementById('date-label').textContent = now.toLocaleDateString('es-ES', opts);
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 3. Meteorología en Vivo
    const LAT = 43.263;
    const LON = -2.935;
    let cachedWeather = null;

    async function loadWeather() {
      try {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`;
        const res = await fetch(url);
        cachedWeather = await res.json();

        if (cachedWeather) {
          const curTemp = Math.round(cachedWeather.current.temperature_2m);
          const max = Math.round(cachedWeather.daily.temperature_2m_max[0]);
          const min = Math.round(cachedWeather.daily.temperature_2m_min[0]);
          const rain = cachedWeather.daily.precipitation_probability_max[0] || 0;
          const info = interpretWeather(cachedWeather.current.weather_code, rain);

          document.getElementById('w-temp').textContent = `${curTemp}°`;
          document.getElementById('w-icon').textContent = info.icon;
          document.getElementById('w-summary').textContent = info.desc;
          document.getElementById('w-sub').textContent = `Mín: ${min}° • Máx: ${max}° • 💧 ${rain}%`;
        }
      } catch (e) {
        document.getElementById('w-summary').textContent = "Previsión local";
      }
    }
    loadWeather();
    setInterval(loadWeather, 600000);

    function interpretWeather(code, rain) {
      if (code >= 51 && code <= 67) return { desc: "Lluvia", icon: "🌧️", advice: "coge paraguas" };
      if (code >= 71 && code <= 86) return { desc: "Nieve", icon: "❄️", advice: "abrigo gordo" };
      if (code >= 95) return { desc: "Tormenta", icon: "⛈️", advice: "cuidado en la calle" };
      if (code === 0) return { desc: "Despejado", icon: "☀️", advice: "buen día para salir" };
      if (code <= 3) return { desc: "Nublado", icon: "⛅", advice: rain > 40 ? "posible chaparrón" : "buena temperatura" };
      return { desc: "Cubierto", icon: "☁️", advice: rain > 40 ? "lleva chubasquero" : "ambiente fresco" };
    }

    async function askWeather(targetDay) {
      if (!cachedWeather) await loadWeather();
      if (!cachedWeather || !cachedWeather.daily) {
        speak("No he podido consultar el tiempo.", "⚠️");
        return;
      }

      const isTomorrow = targetDay === 'mañana';
      const idx = isTomorrow ? 1 : 0;
      const max = Math.round(cachedWeather.daily.temperature_2m_max[idx]);
      const min = Math.round(cachedWeather.daily.temperature_2m_min[idx]);
      const rain = cachedWeather.daily.precipitation_probability_max[idx] || 0;
      const code = cachedWeather.daily.weather_code[idx];
      const info = interpretWeather(code, rain);

      const phrase = `${isTomorrow ? 'Mañana' : 'Hoy'} en Bilbao tendremos ${info.desc}, con mínimas de ${min} y máximas de ${max} grados. Probabilidad de lluvia del ${rain} por ciento. Te aconsejo que ${info.advice}.`;
      speak(phrase, info.icon);
    }

    function speak(text, icon = "🤖") {
      document.getElementById('bubble-text').textContent = text;
      document.getElementById('bubble-icon').textContent = icon;

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'es-ES';
        utter.rate = 1.05;
        window.speechSynthesis.speak(utter);
      }
    }

    // 4. Calendario y Google Calendar
    let myEvents = JSON.parse(localStorage.getItem('garraioa_events') || '[]');

    function saveEvents() {
      localStorage.setItem('garraioa_events', JSON.stringify(myEvents));
      renderEvents();
    }

    function createGCalUrl(title, date, time) {
      const startDateTime = new Date(`${date}T${time || '12:00'}:00`);
      const endDateTime = new Date(startDateTime.getTime() + 60 * 60 * 1000);
      const formatGCal = (d) => d.toISOString().replace(/-|:|\.\d+/g, '');
      return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${formatGCal(startDateTime)}/${formatGCal(endDateTime)}`;
    }

    function renderEvents() {
      const container = document.getElementById('events-container');
      container.innerHTML = '';

      if (myEvents.length === 0) {
        container.innerHTML = '<div style="color:var(--text-muted); font-size:0.8rem; text-align:center; padding:18px;">No tienes eventos programados.</div>';
        return;
      }

      myEvents.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

      myEvents.forEach((ev, idx) => {
        const item = document.createElement('div');
        item.className = 'event-item';
        const gcalUrl = createGCalUrl(ev.title, ev.date, ev.time);

        item.innerHTML = `
          <div class="event-info">
            <h4>${ev.title}</h4>
            <p>📅 ${ev.date} a las ${ev.time} ${ev.source === 'google' ? '• GCal' : ''}</p>
          </div>
          <div class="event-actions">
            <a href="${gcalUrl}" target="_blank" class="btn-gcal">GCal ↗</a>
            <button class="btn-del-event" onclick="deleteEvent(${idx})">&times;</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function addEventManual() {
      const title = document.getElementById('new-event-title').value.trim();
      const date = document.getElementById('new-event-date').value;
      const time = document.getElementById('new-event-time').value || "12:00";

      if (!title || !date) {
        alert("Introduce un título y una fecha.");
        return;
      }

      myEvents.push({ title, date, time, source: 'local' });
      saveEvents();
      document.getElementById('new-event-title').value = '';
      speak(`Añadido "${title}" para el día ${date}.`, "📅");
    }

    function deleteEvent(idx) {
      myEvents.splice(idx, 1);
      saveEvents();
    }

    async function saveAndSyncIcal() {
      const url = document.getElementById('ical-url-input').value.trim();
      if (!url) return;

      localStorage.setItem('garraioa_ical_url', url);

      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
        const res = await fetch(proxyUrl);
        const icsText = await res.text();
        parseIcsEvents(icsText);
        speak("Calendario de Google sincronizado con éxito.", "✅");
      } catch (err) {
        speak("No se pudo descargar el archivo iCal.", "⚠️");
      }
    }

    function parseIcsEvents(icsData) {
      const lines = icsData.split(/\r\n|\n|\r/);
      let inEvent = false, curTitle = '', curDate = '', curTime = '10:00';

      lines.forEach(line => {
        if (line.startsWith('BEGIN:VEVENT')) {
          inEvent = true; curTitle = ''; curDate = ''; curTime = '10:00';
        } else if (line.startsWith('END:VEVENT')) {
          if (inEvent && curTitle && curDate) {
            if (!myEvents.some(e => e.title === curTitle && e.date === curDate)) {
              myEvents.push({ title: curTitle, date: curDate, time: curTime, source: 'google' });
            }
          }
          inEvent = false;
        } else if (inEvent) {
          if (line.startsWith('SUMMARY:')) curTitle = line.replace('SUMMARY:', '').trim();
          if (line.startsWith('DTSTART')) {
            const val = line.split(':')[1] || '';
            if (val.length >= 8) {
              curDate = `${val.slice(0,4)}-${val.slice(4,6)}-${val.slice(6,8)}`;
              if (val.length >= 13) curTime = `${val.slice(9,11)}:${val.slice(11,13)}`;
            }
          }
        }
      });
      saveEvents();
    }

    function openCalendarModal() {
      const savedIcal = localStorage.getItem('garraioa_ical_url');
      if (savedIcal) document.getElementById('ical-url-input').value = savedIcal;
      renderEvents();
      document.getElementById('calendar-modal').classList.add('open');
    }

    function closeCalendarModal() {
      document.getElementById('calendar-modal').classList.remove('open');
    }

    function checkEventsByVoice(isTomorrow = false) {
      const targetDate = new Date();
      if (isTomorrow) targetDate.setDate(targetDate.getDate() + 1);
      const dateStr = targetDate.toISOString().split('T')[0];

      const matches = myEvents.filter(e => e.date === dateStr);
      if (matches.length === 0) {
        speak(`No tienes nada anotado para ${isTomorrow ? 'mañana' : 'hoy'}.`, "📅");
      } else {
        const listText = matches.map(m => `${m.title} a las ${m.time}`).join(', ');
        speak(`Para ${isTomorrow ? 'mañana' : 'hoy'} tienes previsto: ${listText}.`, "📅");
      }
    }

    // 5. Entrada por Voz
    let recognition = null;
    let isListening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechClass = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechClass();
      recognition.lang = 'es-ES';
      recognition.continuous = false;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('clock-trigger').classList.add('listening');
        document.getElementById('clock-hint').textContent = 'Escuchando tu voz...';
      };

      recognition.onresult = (e) => {
        const query = e.results[0][0].transcript.toLowerCase();
        handleVoiceQuery(query);
      };

      recognition.onerror = () => stopListening();
      recognition.onend = () => stopListening();
    }

    function toggleVoice() {
      if (!recognition) {
        alert("El navegador no soporta entrada de voz.");
        return;
      }
      if (isListening) recognition.stop();
      else recognition.start();
    }

    function stopListening() {
      isListening = false;
      document.getElementById('clock-trigger').classList.remove('listening');
      document.getElementById('clock-hint').textContent = 'Toca la hora para hablar';
    }

    function handleVoiceQuery(text) {
      if (text.includes('apuntar') || text.includes('añadir') || text.includes('anota') || text.includes('recordar')) {
        let isTomorrow = text.includes('mañana');
        const targetDate = new Date();
        if (isTomorrow) targetDate.setDate(targetDate.getDate() + 1);
        const dateStr = targetDate.toISOString().split('T')[0];

        let timeStr = "12:00";
        const hourMatch = text.match(/a las (\d{1,2})/);
        if (hourMatch) timeStr = `${String(hourMatch[1]).padStart(2,'0')}:00`;

        let title = text.replace(/apuntar|añadir|anota|recordar|mañana|hoy|a las \d{1,2}/gi, '').trim();
        if (!title) title = "Evento pendiente";

        myEvents.push({ title: title.charAt(0).toUpperCase() + title.slice(1), date: dateStr, time: timeStr, source: 'local' });
        saveEvents();
        speak(`Anotado: "${title}" para ${isTomorrow ? 'mañana' : 'hoy'} a las ${timeStr}.`, "✅");
      } 
      else if (text.includes('agenda') || text.includes('tengo hoy') || text.includes('planes')) {
        checkEventsByVoice(text.includes('mañana'));
      }
      else if (text.includes('mañana')) {
        askWeather('mañana');
      } else if (text.includes('hoy') || text.includes('tiempo') || text.includes('llueve') || text.includes('temperatura')) {
        askWeather('hoy');
      } else {
        speak(`He oído: "${text}". Puedes pedir el tiempo o decir "Apunta reunión mañana a las cinco".`, "🤔");
      }
    }

    document.getElementById('new-event-date').value = new Date().toISOString().split('T')[0];

    async function keepAwake() {
      try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e){}
    }
    keepAwake();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  </script>
</body>
</html>
