<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#030407">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Desk Orbit • Clock, Music & Panda House</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Fondo ambiental reactivo -->
  <div class="ambient-glow" id="ambient-glow"></div>

  <!-- Botón Pantalla Completa -->
  <button class="fullscreen-trigger" onclick="toggleFullscreen()" title="Pantalla completa">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
    </svg>
  </button>

  <!-- Contenedor del Carrusel -->
  <div class="stage-viewport">
    <div class="carousel-track" id="carousel-track">

      <!-- ================= PÁGINA 1: RELOJ ================= -->
      <section class="stage-slide slide-clock">
        <div class="clock-display">
          <div class="time-main">
            <span id="hours-mins">--:--</span>
            <span class="seconds-sub" id="seconds">--</span>
          </div>
          <div class="date-full" id="date-label">Cargando fecha...</div>
        </div>
      </section>

      <!-- ================= PÁGINA 2: SPOTIFY NOW PLAYING ================= -->
      <section class="stage-slide slide-music">
        <!-- Sub-vista A: Autorización -->
        <div class="music-auth-card" id="music-auth">
          <div class="auth-icon">
            <svg viewBox="0 0 24 24" fill="#1db954" width="44" height="44">
              <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.495 17.303c-.215.353-.676.467-1.03.25-2.822-1.724-6.375-2.115-10.56-1.158-.403.092-.81-.16-.902-.563-.092-.404.16-.811.563-.903 4.582-1.047 8.513-.604 11.677 1.344.354.217.468.677.252 1.03zm1.467-3.26c-.27.44-.848.58-1.288.31-3.23-1.986-8.155-2.56-11.976-1.4-1.498-.5-.815.148-1.314-.352-.15-.499.148-1.002.648-1.152 4.372-1.326 9.794-.69 13.43 1.545.44.27.58.848.31 1.289zm.126-3.41c-3.873-2.3-10.264-2.513-13.98-1.383-.594.18-1.222-.156-1.403-.75-.18-.594.156-1.223.75-1.404 4.267-1.295 11.318-1.047 15.787 1.606.534.317.708 1.01.39 1.545-.317.534-1.01.708-1.544.39z"/>
            </svg>
          </div>
          <h3>Spotify Now Playing</h3>
          <p>Conecta tu cuenta para ver la carátula y el control en directo.</p>
          <input type="text" id="client-id-input" placeholder="Client ID de Spotify" class="dark-input">
          <button class="btn-spotify" onclick="loginSpotify()">Conectar cuenta</button>
        </div>

        <!-- Sub-vista B: Reproductor Activo -->
        <div class="music-player-layout" id="music-player" style="display: none;">
          <div class="art-column">
            <div class="art-frame">
              <img id="track-art" src="" alt="Album Art">
              <div class="eq-badge" id="eq-indicator">
                <span></span><span></span><span></span>
              </div>
            </div>
          </div>

          <div class="track-column">
            <div class="track-header">
              <h2 id="track-name">Sin reproducción</h2>
              <h3 id="track-artist">Abre Spotify en tu ordenador</h3>
              <p id="track-album">--</p>
            </div>

            <div class="progress-wrap">
              <span id="time-cur">0:00</span>
              <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
              </div>
              <span id="time-tot">0:00</span>
            </div>

            <div class="track-actions-modern">
              <button class="btn-ctrl-modern" onclick="controlPlayback('previous')" title="Anterior">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
              </button>

              <button class="btn-ctrl-modern btn-play-white" id="btn-play-pause" onclick="togglePlayPause()" title="Play / Pausa">
                <svg id="play-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pause-svg" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
              </button>

              <button class="btn-ctrl-modern" onclick="controlPlayback('next')" title="Siguiente">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
              </button>
            </div>

            <div class="device-tag" id="device-label">🔊 Buscando dispositivo...</div>
          </div>
        </div>
      </section>

      <!-- ================= PÁGINA 3: CASA COMPLETA DEL PANDA ================= -->
      <section class="stage-slide slide-panda">
        <div class="panda-main-wrapper">
          
          <div class="house-header">
            <span class="house-title">🏠 Residencia Panda</span>
            <span class="house-status" id="panda-state-label">Descansando</span>
          </div>

          <!-- Estructura de la Casa (Vista aérea arquitectónica) -->
          <div class="house-blueprint" id="house-floor">

            <!-- HABITACIÓN 1: DORMITORIO -->
            <div class="room-zone zone-bedroom" onclick="forcePandaAction('bed')">
              <div class="room-label">Dormitorio</div>
              <div class="furn-item bed-double">
                <div class="bed-pillows"><span></span><span></span></div>
                <div class="bed-duvet"></div>
              </div>
              <div class="furn-item rug-bed"></div>
              <div class="furn-item nightstand"></div>
            </div>

            <!-- HABITACIÓN 2: OFICINA / SETUP -->
            <div class="room-zone zone-office" onclick="forcePandaAction('desk')">
              <div class="room-label">Despacho</div>
              <div class="furn-item office-desk">
                <div class="dual-monitor"><span></span><span></span></div>
                <div class="keyboard-pad"></div>
              </div>
              <div class="furn-item gaming-chair"></div>
            </div>

            <!-- HABITACIÓN 3: COCINA & COMEDOR -->
            <div class="room-zone zone-kitchen" onclick="forcePandaAction('fridge')">
              <div class="room-label">Cocina</div>
              <div class="furn-item counter-cooktop"></div>
              <div class="furn-item fridge-steel"><span>BAMBÚ</span></div>
              <div class="furn-item dining-table"><div class="bamboo-bowl">🎋</div></div>
            </div>

            <!-- HABITACIÓN 4: BAÑO -->
            <div class="room-zone zone-bathroom" onclick="forcePandaAction('bath')">
              <div class="room-label">Aseo</div>
              <div class="furn-item shower-cabin"></div>
              <div class="furn-item toilet-unit"></div>
              <div class="furn-item sink-unit"></div>
            </div>

            <!-- PASILLO CENTRAL -->
            <div class="hallway-strip" onclick="forcePandaAction('hall')"></div>

            <!-- PERSONAJE PANDA VISTO DESDE ARRIBA CON DETALLES -->
            <div class="panda-entity" id="panda-avatar">
              <div class="speech-bubble" id="panda-bubble">¡Hola! 🐾</div>
              <div class="panda-top-ears">
                <span class="p-ear left"></span>
                <span class="p-ear right"></span>
              </div>
              <div class="panda-top-head">
                <div class="p-eye left"></div>
                <div class="p-eye right"></div>
                <div class="p-snout"></div>
              </div>
              <div class="panda-top-body">
                <div class="p-shoulder-patch"></div>
              </div>
            </div>

          </div>

          <!-- Controles de la casa -->
          <div class="house-actions-row">
            <button class="btn-room" onclick="forcePandaAction('bed')">🛏️ Dormir</button>
            <button class="btn-room" onclick="forcePandaAction('desk')">💻 Setup</button>
            <button class="btn-room" onclick="forcePandaAction('fridge')">🎋 Comer</button>
            <button class="btn-room" onclick="forcePandaAction('bath')">🚿 Ducha</button>
            <button class="btn-room" onclick="forcePandaAction('hall')">🚶 Pasillo</button>
          </div>

        </div>
      </section>

    </div>
  </div>

  <!-- Navegación inferior fija -->
  <nav class="book-nav">
    <button class="nav-arrow" onclick="rotateSlide(-1)">‹</button>
    <div class="page-dots">
      <span class="dot active" onclick="goToSlide(0)"></span>
      <span class="dot" onclick="goToSlide(1)"></span>
      <span class="dot" onclick="goToSlide(2)"></span>
    </div>
    <button class="nav-arrow" onclick="rotateSlide(1)">›</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
