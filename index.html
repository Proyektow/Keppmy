<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#020408">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Desk Orbit • Clock, Music & Calendar</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <!-- Fondo dinámico con desenfoque reactivo -->
  <div class="ambient-glow" id="ambient-glow"></div>

  <!-- Banner de alerta de eventos próximos -->
  <aside class="event-banner-toast" id="event-toast">
    <div class="toast-indicator">🔔</div>
    <div class="toast-body">
      <div class="toast-title" id="toast-title">Cita próxima</div>
      <div class="toast-meta" id="toast-meta">En menos de 10 minutos</div>
    </div>
  </aside>

  <!-- Botones de esquina: Modo Pantalla Completa y Permiso Notificaciones -->
  <header class="top-bar-controls">
    <button class="icon-chip" id="notif-toggle-btn" onclick="requestNotificationPermission()" title="Notificaciones de eventos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="chip-badge" id="notif-badge"></span>
    </button>
    <!-- Botón para activar/desactivar el sensor aéreo -->
<button class="icon-chip" id="wave-sensor-btn" onclick="toggleAirGestureSensor()" title="Gestos en el aire">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <!-- Icono de mano / onda -->
    <path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path>
    <path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path>
    <path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path>
    <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path>
  </svg>
  <span class="chip-badge" id="sensor-active-dot"></span>
</button>

<!-- Elementos invisibles para procesamiento de movimiento -->
<video id="air-video" playsinline muted style="display: none;"></video>
<canvas id="air-canvas" width="16" height="16" style="display: none;"></canvas>

    <button class="icon-chip" onclick="toggleFullscreen()" title="Pantalla completa inmersiva">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
      </svg>
    </button>
  </header>

  <!-- Contenedor del Carrusel (3 caras) -->
  <div class="stage-viewport">
    <div class="carousel-track" id="carousel-track">

      <!-- ================= PÁGINA 1: RELOJ ================= -->
      <section class="stage-slide slide-clock">
        <div class="clock-display">
          <div class="time-main">
            <span id="hours-mins">--:--</span>
            <span class="seconds-sub" id="seconds">--</span>
          </div>
          <div class="date-full" id="date-label">Cargando fecha...</div>
          
          <!-- Widget rápido de la próxima cita del día -->
          <div class="next-agenda-pill" id="next-agenda-pill" onclick="goToSlide(2)">
            <span class="pill-dot"></span>
            <span class="pill-text" id="quick-agenda-text">Sin citas inmediatas</span>
          </div>
        </div>
      </section>

      <!-- ================= PÁGINA 2: SPOTIFY NOW PLAYING ================= -->
      <section class="stage-slide slide-music">
        <!-- Tarjeta de conexión -->
        <div class="music-auth-card" id="music-auth">
          <div class="auth-icon">
            <svg viewBox="0 0 24 24" fill="#1ed760" width="46" height="46">
              <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.495 17.303c-.215.353-.676.467-1.03.25-2.822-1.724-6.375-2.115-10.56-1.158-.403.092-.81-.16-.902-.563-.092-.404.16-.811.563-.903 4.582-1.047 8.513-.604 11.677 1.344.354.217.468.677.252 1.03zm1.467-3.26c-.27.44-.848.58-1.288.31-3.23-1.986-8.155-2.56-11.976-1.4-1.498-.5-.815.148-1.314-.352-.15-.499.148-1.002.648-1.152 4.372-1.326 9.794-.69 13.43 1.545.44.27.58.848.31 1.289zm.126-3.41c-3.873-2.3-10.264-2.513-13.98-1.383-.594.18-1.222-.156-1.403-.75-.18-.594.156-1.223.75-1.404 4.267-1.295 11.318-1.047 15.787 1.606.534.317.708 1.01.39 1.545-.317.534-1.01.708-1.544.39z"/>
            </svg>
          </div>
          <h3>Spotify Now Playing</h3>
          <p>Control de carátula y reproducción para tu escritorio.</p>
          <input type="text" id="client-id-input" placeholder="Spotify Client ID" class="dark-input">
          <div class="auth-btn-row">
            <button class="btn-spotify" onclick="loginSpotify()">Conectar cuenta</button>
            <button class="btn-demo" onclick="activateDemoMusic()">Modo Demo</button>
          </div>
        </div>

        <!-- Reproductor Activo -->
        <div class="music-player-layout" id="music-player" style="display: none;">
          <div class="art-column">
            <div class="art-frame">
              <img id="track-art" src="" alt="Album Art">
              <div class="eq-badge" id="eq-indicator">
                <span></span><span></span><span></span>
              </div>
            </div>
          </div>

          <div class="track-column">
            <div class="track-header">
              <h2 id="track-name">Sin reproducción</h2>
              <h3 id="track-artist">Abre Spotify</h3>
              <p id="track-album">--</p>
            </div>

            <div class="progress-wrap">
              <span id="time-cur">0:00</span>
              <div class="progress-bar" onclick="seekSong(event)">
                <div class="progress-fill" id="progress-fill"></div>
              </div>
              <span id="time-tot">0:00</span>
            </div>

            <div class="track-actions-modern">
              <button class="btn-ctrl-modern" onclick="controlPlayback('previous')" title="Anterior">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
              </button>

              <button class="btn-ctrl-modern btn-play-white" id="btn-play-pause" onclick="togglePlayPause()" title="Play / Pausa">
                <svg id="play-svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                <svg id="pause-svg" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
              </button>

              <button class="btn-ctrl-modern" onclick="controlPlayback('next')" title="Siguiente">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
              </button>
            </div>

            <div class="device-tag" id="device-label">🔊 Buscando dispositivo...</div>
          </div>
        </div>
      </section>

      <!-- ================= PÁGINA 3: AGENDA & RECORDATORIOS ================= -->
      <section class="stage-slide slide-calendar">
        <div class="calendar-layout">
          <!-- Columna Izquierda: Formulario y carga de archivo -->
          <div class="calendar-composer">
            <div class="composer-header">
              <h3>Agenda de Mesa</h3>
              <span class="agenda-count" id="agenda-count-badge">0 eventos</span>
            </div>

            <form class="event-form" onsubmit="handleManualEventSubmit(event)">
              <input type="text" id="ev-title" placeholder="Título (ej. Reunión, Gym, Clase)..." required class="cal-input">
              <div class="cal-input-row">
                <input type="date" id="ev-date" required class="cal-input flex-1">
                <input type="time" id="ev-time" required class="cal-input w-time">
              </div>
              <button type="submit" class="btn-add-event">+ Guardar recordatorio</button>
            </form>

            <div class="ical-dropzone">
              <label for="ics-file-input" class="file-label">
                <span>📁 Importar .ics descargado</span>
                <input type="file" id="ics-file-input" accept=".ics" onchange="handleIcsUpload(event)">
              </label>
            </div>
          </div>

          <!-- Columna Derecha: Lista de citas ordenadas cronológicamente -->
          <div class="calendar-list-view">
            <div class="list-head">Citas Programadas</div>
            <div class="events-scroll" id="events-scroll-container">
              <!-- Rellenado por app.js -->
            </div>
          </div>
        </div>
      </section>

    </div>
  </div>

  <!-- PANDA VAGABUNDO EN EL FONDO -->
  <div class="panda-wanderer" id="panda-walker" onclick="interactWithPanda()">
    <div class="panda-thought" id="panda-thought">🎋 ¡Ñam!</div>
    <div class="panda-sprite">
      <div class="p-ears">
        <span class="p-ear left"></span>
        <span class="p-ear right"></span>
      </div>
      <div class="p-head">
        <span class="p-eye left"></span>
        <span class="p-eye right"></span>
        <span class="p-nose"></span>
      </div>
      <div class="p-body">
        <span class="p-bamboo-stem" id="panda-bamboo">🎋</span>
        <span class="p-paw left"></span>
        <span class="p-paw right"></span>
      </div>
      <div class="p-feet">
        <span class="p-foot left"></span>
        <span class="p-foot right"></span>
      </div>
    </div>
  </div>

  <!-- Navegación inferior flotante -->
  <nav class="book-nav">
    <button class="nav-arrow" onclick="rotateSlide(-1)">‹</button>
    <div class="page-dots">
      <span class="dot active" onclick="goToSlide(0)"></span>
      <span class="dot" onclick="goToSlide(1)"></span>
      <span class="dot" onclick="goToSlide(2)"></span>
    </div>
    <button class="nav-arrow" onclick="rotateSlide(1)">›</button>
  </nav>
  <!-- Elementos invisibles para el cálculo del gesto aéreo -->
  <video id="air-video" playsinline muted style="display: none;"></video>
  <canvas id="air-canvas" width="16" height="16" style="display: none;"></canvas>

  <script src="app.js"></script>
</body>
</html>
