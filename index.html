<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#06080d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aura">
  <title>Aura • Asistente & Reloj</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>

  <div class="app-viewport">
    <!-- 1. Bloque Meteorológico -->
    <header class="weather-hero" id="weather-card" onclick="askWeather('hoy')">
      <div class="weather-left">
        <div class="weather-icon-big" id="w-icon">⛅</div>
        <div class="weather-temp-giant" id="w-temp">--°</div>
      </div>
      <div class="weather-right">
        <div class="weather-app-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="9"/>
            <path d="M12 3a9 9 0 0 1 9 9"/>
          </svg>
          Aura • Bilbao
        </div>
        <div class="weather-desc-lead" id="w-summary">Cargando...</div>
        <div class="weather-submetrics" id="w-sub">Mín: --° • Máx: --° • 💧 --%</div>
      </div>
    </header>

    <!-- 2. Reloj Principal (Tocar para activar asistente) -->
    <main class="clock-container" id="clock-trigger" onclick="toggleVoice()">
      <div class="time-digits">
        <span id="hours-mins">--:--</span><span class="seconds-mark" id="seconds">--</span>
      </div>
      <div class="date-label" id="date-label">Cargando fecha...</div>
      <div class="clock-hint" id="clock-hint">Toca la hora para hablar</div>
    </main>

    <!-- 3. Respuesta Asistente -->
    <section class="assistant-bubble" id="assistant-bubble">
      <div class="assistant-icon-mini" id="bubble-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="#38bdf8" stroke-width="2"/>
          <circle cx="9" cy="9" r="3" fill="#fbbf24"/>
          <path d="M12 5a7 7 0 0 1 7 7c0 3.8-3.1 7-7 7a6.9 6.9 0 0 1-4.2-1.4c3.4 0 6.2-2.8 6.2-6.2 0-2.4-1.3-4.5-3.2-5.6.7-.5 1.4-.8 2.2-.8z" fill="#e0e7ff"/>
        </svg>
      </div>
      <div class="assistant-bubble-text" id="bubble-text">Aura lista. Pídeme el tiempo del fin de semana o tus próximos eventos.</div>
    </section>

    <!-- 4. Barra Inferior de Acciones Rápidas -->
    <footer class="bottom-toolbar" id="main-toolbar">
      <button class="btn-compact" onclick="askWeather('hoy')"><span>☀️</span> Hoy</button>
      <button class="btn-compact" onclick="askWeather('finde')"><span>🏖️</span> Finde</button>
      <button class="btn-compact" onclick="checkUpcomingEvents()"><span>🔮</span> Próximos</button>
      <button class="btn-compact" onclick="openCalendarModal()"><span>📅</span> Agenda</button>
      <button class="btn-compact btn-install-pwa" id="btn-install" onclick="triggerPwaInstall()"><span>📲</span> Instalar</button>
    </footer>
  </div>

  <!-- Modal Calendario & Sincronización -->
  <div class="modal-backdrop" id="calendar-modal">
    <div class="modal-box">
      <div class="modal-head">
        <h3 class="modal-title">Agenda Aura & Google Calendar</h3>
        <button class="btn-close" onclick="closeCalendarModal()">&times;</button>
      </div>

      <div class="sync-config-box">
        <label>Importar calendario (archivo ical.zip o .ics):</label>
        <div class="file-row">
          <input type="file" id="file-calendar-input" accept=".zip,.ics" class="input-event">
          <button class="btn-save-event" onclick="handleCalendarFileUpload()">Cargar</button>
        </div>
      </div>

      <div class="events-list" id="events-container"></div>

      <div class="quick-add-form">
        <input type="text" id="new-event-title" placeholder="Nuevo evento (ej. Clase, Gym)..." class="input-event">
        <div class="form-datetime-row">
          <input type="date" id="new-event-date" class="input-event flex-1">
          <input type="time" id="new-event-time" class="input-event w-100">
        </div>
        <button class="btn-save-event" onclick="addEventManual()">Guardar en Agenda</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
